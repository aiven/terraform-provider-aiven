# yaml-language-server: $schema=.schema.yml
location: internal/plugin/service/kafka/nativeacl
resource:
  refreshStateExists: true
  removeMissing: true
  description: |
    Creates and manages Kafka-native [access control lists](https://aiven.io/docs/products/kafka/concepts/acl) (ACLs) for an Aiven for Apache Kafka® service. ACLs control access to Kafka topics, consumer groups, clusters, and Schema Registry.

    Kafka-native ACLs provide advanced resource-level access control with fine-grained permissions, including `ALLOW` and `DENY` rules. For simplified topic-level control you can use [Aiven ACLs](https://registry.terraform.io/providers/aiven/aiven/latest/docs/resources/kafka_acl).
clientHandler: kafka
idAttributeComposed: [project, service_name, acl_id]
legacyTimeouts: true
rename:
  id: acl_id
  kafka_acl_id: acl_id
operations:
  - id: ServiceKafkaNativeAclAdd
    type: create
    resultKey: acl
  - id: ServiceKafkaNativeAclGet
    type: read
    resultKey: acl
  - id: ServiceKafkaNativeAclDelete
    type: delete
schema:
  # host is optional on create (no default in the spec), but when omitted the
  # server still returns a value (e.g. "*"). Marking it computed lets that
  # server-assigned value populate state without a "provider produced
  # inconsistent result" error; useStateForUnknown keeps it stable across plans
  # instead of showing spurious diffs. This mirrors the old SDK resource, which
  # set host to Optional+Computed for the same reason.
  host:
    computed: true
    useStateForUnknown: true
