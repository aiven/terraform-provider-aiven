# yaml-language-server: $schema=.schema.yml
resource:
  description: |
    Approve a new Google Private Service Connect connection.

    Destroying this resource removes it from Terraform state only. It does not revoke approval or delete the endpoint.
    To remove one connection, delete its consumer forwarding rule.
    Deleting the parent `aiven_gcp_privatelink` resource removes service-level PrivateLink
    and can disrupt other PSC connections for the service.
  # Keep the hand-written example with the consumer forwarding rule.
  disableExample: true
  refreshState: true
  removeMissing: true
  # Keep SDK upgrades with an empty PSC selector from replacing the Terraform resource.
  modifyPlan: true
  importExample: |
    terraform import aiven_gcp_privatelink_connection_approval.example PROJECT/SERVICE_NAME
    # For a service with multiple PSC connections, run this instead:
    # terraform import aiven_gcp_privatelink_connection_approval.example PROJECT/SERVICE_NAME/PSC_CONNECTION_ID

    # Identity-based import requires exactly one PSC connection for the service.
    # For multiple connections, use the PSC-qualified string import above.
clientHandler: privatelink
identityFields: [project, service_name]
legacyTimeouts: true
operations:
  - id: ServicePrivatelinkGoogleConnectionCreate
    type: create
    disableView: true
  - id: ServicePrivatelinkGoogleConnectionList
    type: read
    # Unwrap the connection schema even though readView performs the lookup.
    resultKey: connections
    disableView: true
  - id: ServicePrivatelinkGoogleConnectionCreate
    # Applying an imported pending connection uses the same approval endpoint.
    type: update
    disableView: true
schema:
  project:
    ref: aiven_gcp_privatelink.project
  service_name:
    ref: aiven_gcp_privatelink.service_name
  user_ip_address:
    # The API accepts only IPv4, but the published schema omits the format.
    format: ipv4
    description: |
      Frontend IP address of the consumer forwarding rule.
      Changing this address on an approved connection fails during apply.
      To use a different IP, recreate the forwarding rule and approve the new connection using its new `psc_connection_id`.
  privatelink_connection_id:
    # Required in the approve URL, but discovered by the Terraform resource.
    required: false
    computed: true
    forceNew: false
    # Rediscovering the same PSC endpoint can assign a new Aiven connection ID.
    useStateForUnknown: false
  psc_connection_id:
    # A Terraform lookup selector, absent from the API request body.
    optional: true
    # SDKv2 stored the discovered PSC ID even when configuration used "".
    # ForceNew would replace the Terraform resource and discard its saved connection selection.
    # modifyPlan allows a state-only update to "", changed nonempty or unknown IDs still require replacement.
    forceNew: false
    # Optional+Computed IDs do not retain their state automatically.
    useStateForUnknown: true
    description: |
      Google Private Service Connect connection ID for this connection.
      Changing to a different nonempty ID forces recreation of the resource.
      An empty string keeps the currently managed connection.
