# yaml-language-server: $schema=.schema.yml
resource:
  description: Creates and manages an Azure VPC peering connection with an Aiven VPC.
  refDepth: 2
  refreshStateExists: true
  deleteStateGone: true
  removeMissing: true
  modifyPlan: true
datasource:
  description: Gets information about an Azure VPC peering connection.
  # VpcGet returns all peerings for a VPC and accepts no peer filters.
  # These overrides define Terraform's local lookup, which OpenAPI does not describe.
  schemaOverride:
    # Either `vpc_id` or `project` with `project_vpc_id` selects the Aiven VPC.
    project:
      optional: true
      computed: true
      description: The name of the project the Aiven VPC belongs to.
    project_vpc_id:
      optional: true
      computed: true
      description: The ID of the Aiven VPC.
    vpc_id:
      optional: true
      computed: true
      description: The ID of the Aiven VPC, in the `PROJECT/PROJECT_VPC_ID` format.
    peer_resource_group:
      required: true
    peer_azure_app_id:
      required: true
    peer_azure_tenant_id:
      required: true
clientHandler: vpc
idAttributeComposed: [project, project_vpc_id, azure_subscription_id, vnet_name]
legacyTimeouts: true
rename:
  peer_cloud_account: azure_subscription_id
  peer_vpc: vnet_name
operations:
  - id: VpcPeeringConnectionCreate
    type: create
    disableView: true
  - id: VpcGet
    type: read
    resultKey: peering_connections
    disableView: true
  - id: VpcPeeringConnectionWithResourceGroupDelete
    type: delete
    disableView: true
remove:
  - peer_region
  - "state_info/*"
  - update_time
  - user_peer_network_cidrs
  - vpc_peering_connection_type
schema:
  create_time:
    description: VPC peering connection creation timestamp. Re-creating a connection updates this timestamp even when its ID stays the same.
  # modifyPlan replaces the resource when the Aiven VPC changes, so switching between
  # `vpc_id` and `project` with `project_vpc_id` keeps the connection.
  project:
    ref: aiven_project_vpc.project
    optional: true
    computed: true
    forceNew: false
    alsoRequires: [project_vpc_id]
    description: The name of the project the Aiven VPC belongs to. Changing the Aiven VPC forces recreation of the resource.
    example: example-project
  project_vpc_id:
    ref: aiven_project_vpc.project_vpc_id
    optional: true
    computed: true
    forceNew: false
    alsoRequires: [project]
    conflictsWith: [vpc_id]
    description: The ID of the Aiven VPC. Changing the Aiven VPC forces recreation of the resource.
    example: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
  vpc_id:
    ref: aiven_project_vpc.id
    type: string
    optional: true
    computed: true
    forceNew: false
    exactlyOneOf: [vpc_id, project]
    pattern: '^[^/]*/[^/]*$'
    description: The ID of the Aiven VPC, in the `PROJECT/PROJECT_VPC_ID` format. Changing the Aiven VPC forces recreation of the resource; switching to `project` and `project_vpc_id` doesn't.
    deprecationMessage: Use the separate `project` and `project_vpc_id` fields instead.
    example: example-project/1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
  azure_subscription_id:
    description: The ID of the Azure subscription in UUID4 format.
    example: 12345678-1234-1234-1234-123456789012
  vnet_name:
    description: The name of the Azure VNet.
    example: my-vnet
  peer_resource_group:
    required: true
    example: my-resource-group
  peer_azure_app_id:
    required: true
    example: 87654321-4321-4321-4321-210987654321
  peer_azure_tenant_id:
    required: true
    example: 11111111-2222-3333-4444-555555555555
  peering_connection_id:
    description: Legacy attribute retained for state compatibility. It is not populated by the Project VPC API.
  state_info:
    additionalProperties:
      type: string
