# yaml-language-server: $schema=.schema.yml
resource:
  description: |
    Creates and manages an Azure VPC peering connection with an Aiven VPC.
    Configure either `vpc_id` or both `project` and `project_vpc_id` to select the Aiven VPC.

    If creation succeeds but the readiness check fails, Terraform keeps the connection in state for replacement.
    To retry with the same peer identifiers, use destroy-before-create for the recovery apply.
    With `create_before_destroy`, the existing connection prevents creation of its replacement.
  refreshStateExists: true
  deleteStateGone: true
  removeMissing: true
  modifyPlan: true
  importIDFormats:
    - PROJECT/PROJECT_VPC_ID/AZURE_SUBSCRIPTION_ID/VNET_NAME
datasource:
  description: Gets information about an Azure VPC peering connection.
  # VpcGet returns all peerings for a VPC and accepts no peer filters.
  # These overrides define Terraform's local lookup, which OpenAPI does not describe.
  schemaOverride:
    # OpenAPI has no Terraform ID; local lookup builds it from the matched connection.
    id:
      computed: true
    # Either `vpc_id` or `project` with `project_vpc_id` selects the Aiven VPC.
    project:
      optional: true
      computed: true
      description: The name of the project the Aiven VPC belongs to.
    project_vpc_id:
      optional: true
      computed: true
      description: The ID of the Aiven VPC.
    vpc_id:
      optional: true
      computed: true
      description: The ID of the Aiven VPC, in the `PROJECT/PROJECT_VPC_ID` format.
    azure_subscription_id:
      required: true
    vnet_name:
      required: true
    peer_resource_group:
      required: true
    peer_azure_app_id:
      required: true
    peer_azure_tenant_id:
      required: true
clientHandler: vpc
legacyTimeouts: true
rename:
  peer_cloud_account: azure_subscription_id
  peer_vpc: vnet_name
operations:
  - id: VpcPeeringConnectionCreate
    type: create
    disableView: true
  - id: VpcGet
    type: read
    resultKey: peering_connections
    disableView: true
  - id: VpcPeeringConnectionWithResourceGroupDelete
    type: delete
    disableView: true
remove:
  - peer_region
  - "state_info/*"
  - update_time
  - user_peer_network_cidrs
  - vpc_peering_connection_type
schema:
  id:
    type: string
    computed: true
    description: Resource ID in the `PROJECT/PROJECT_VPC_ID/AZURE_SUBSCRIPTION_ID/VNET_NAME` format.
    example: example-project/1a2b3c4d-5e6f-4a8b-9c0d-1e2f3a4b5c6d/2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d/my-vnet
  create_time:
    # The generator treats creation timestamps as immutable, but re-requesting a peering changes this value.
    useStateForUnknown: false
    description: VPC peering connection creation timestamp. Re-creating a connection updates this timestamp even when its ID stays the same.
  # modifyPlan replaces the resource when the Aiven VPC changes, so switching between
  # `vpc_id` and `project` with `project_vpc_id` keeps the connection.
  project:
    optional: true
    computed: true
    forceNew: false
    alsoRequires: [project_vpc_id]
    description: The name of the project the Aiven VPC belongs to. Changing the Aiven VPC forces recreation of the resource.
    example: example-project
  project_vpc_id:
    format: uuid
    # OpenAPI omits the lowercase UUID restriction on project VPC paths.
    pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    optional: true
    computed: true
    forceNew: false
    alsoRequires: [project]
    conflictsWith: [vpc_id]
    description: The ID of the Aiven VPC. Changing the Aiven VPC forces recreation of the resource.
  vpc_id:
    type: string
    optional: true
    computed: true
    forceNew: false
    exactlyOneOf: [vpc_id, project]
    # This Terraform selector is absent from OpenAPI; its VPC component must be a lowercase UUID.
    pattern: '^[^/]*/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    description: The ID of the Aiven VPC, in the `PROJECT/PROJECT_VPC_ID` format. Changing the Aiven VPC forces recreation of the resource; switching to `project` and `project_vpc_id` doesn't.
    example: example-project/1a2b3c4d-5e6f-4a8b-9c0d-1e2f3a4b5c6d
  azure_subscription_id:
    format: uuid
    # OpenAPI omits Azure's lowercase UUID restriction.
    pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    description: The ID of the Azure subscription in UUID4 format.
  vnet_name:
    # OpenAPI omits Azure's lowercase name and length restrictions.
    pattern: '^[a-z0-9][a-z0-9_.-]{0,62}[a-z0-9]$'
    description: The name of the Azure VNet.
    example: my-vnet
  peer_resource_group:
    # OpenAPI omits Azure's lowercase name, length and trailing-character restrictions.
    pattern: '^[a-z0-9_.()-]{0,89}[a-z0-9_()-]$'
    required: true
    example: my-resource-group
  peer_azure_app_id:
    required: true
    format: uuid
    # OpenAPI omits Azure's lowercase UUID restriction.
    pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
  peer_azure_tenant_id:
    required: true
    format: uuid
    # OpenAPI omits Azure's lowercase UUID restriction.
    pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
  peering_connection_id:
    # Terraform legacy output absent from the Project VPC API; define it independently of OpenAPI.
    type: string
    computed: true
    description: Legacy attribute retained for state compatibility. It is not populated by the Project VPC API.
  state_info:
    additionalProperties:
      type: string
