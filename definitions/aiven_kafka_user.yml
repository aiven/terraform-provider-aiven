# yaml-language-server: $schema=.schema.yml
include: .service_user.yml
resource:
  description: Creates and manages an Aiven for Apache Kafka® or Aiven for Apache Kafka® Connect service user.
datasource:
  description: Gets information about an Aiven for Apache Kafka® or Aiven for Apache Kafka® Connect service user.
requireServiceReady: [kafka, kafka_connect]
remove:
  - authentication
  - mysql_grants # MySQL grants for the service user
schema:
  project:
    ref: aiven_kafka.project
  service_name:
    ref: aiven_kafka.service_name
