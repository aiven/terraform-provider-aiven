# yaml-language-server: $schema=.schema.yml
resource:
  refDepth: 1
  description: |
    The aiven_static_ip resource allows the creation and deletion of static ips.
    Please note that once a static ip is in the 'assigned' state it is bound to the node it is assigned to and cannot be deleted or disassociated until the node is recycled.
    Plans that would delete static ips that are in the assigned state will be blocked.
  stateAttribute: state
  refreshState:
    desired: [created]
identityFields: [project, static_ip_address_id]
legacyTimeouts: true
operations:
  - id: StaticIPCreate
    type: create
  - id: ProjectStaticIPPatch
    type: update
  # Dissociates the IP first. It's deleted regardless, so the errors are ignored.
  - id: ProjectStaticIPDissociate
    type: delete
    errors: [{as: ignore}]
  - id: StaticIPDelete
    type: delete
  - id: StaticIPList
    type: read
    resultKey: static_ips
    resultListLookupKeys:
      StaticIPAddressId: static_ip_address_id
schema:
  project:
    ref: aiven_organization_project.project_id
  termination_protection:
    default: false
