# yaml-language-server: $schema=.schema.yml
resource:
  description: Creates and manages a Google Cloud VPC peering connection.
  refreshStateExists: true
  deleteStateGone: true
  removeMissing: true
  importIDFormats:
    - PROJECT/VPC_ID/GCP_PROJECT_ID/PEER_VPC
datasource:
  description: The GCP VPC Peering Connection data source provides information about the existing Aiven VPC Peering Connection.
  # VpcGet returns all peerings for a VPC and accepts no peer filters.
  # These overrides define Terraform's local lookup, which OpenAPI does not describe.
  schemaOverride:
    # OpenAPI has no compound Terraform ID; the lookup builds it as an output.
    id:
      computed: true
    # OpenAPI requires project and project_vpc_id separately; Terraform combines them into this required input.
    vpc_id:
      required: true
    # VpcGet exposes peer_cloud_account only in its response; local lookup needs it as a required input.
    gcp_project_id:
      required: true
    # VpcGet exposes peer_vpc only in its response; local lookup needs it as a required input.
    peer_vpc:
      required: true
clientHandler: vpc
legacyTimeouts: true
rename:
  peer_cloud_account: gcp_project_id
operations:
  - id: VpcPeeringConnectionCreate
    type: create
    disableView: true
  - id: VpcGet
    type: read
    resultKey: peering_connections
    disableView: true
  - id: VpcPeeringConnectionDelete
    type: delete
    disableView: true
remove:
  - peer_region
  - peer_resource_group
  - peering_connection_id
  - project
  - project_vpc_id
  - "state_info/*"
  - update_time
  - user_peer_network_cidrs
  - vpc_peering_connection_type
  - peer_azure_app_id # Azure app registration id in UUID4 form that is allowed to create a peering to the peer vnet
  - peer_azure_tenant_id # Azure tenant id in UUID4 form
schema:
  create_time:
    description: |
      VPC peering connection creation timestamp. Re-creating a connection updates this timestamp even when its ID stays the same.
      May be `null` for legacy connections whose creation time is unknown.
  id:
    type: string
    computed: true
    example: example-project/example-vpc/my-gcp-project/my-vpc
    description: Resource ID in the `PROJECT/VPC_ID/GCP_PROJECT_ID/PEER_VPC` format.
  vpc_id:
    type: string
    required: true
    forceNew: true
    pattern: '^[^/]*/[^/]*$'
    example: example-project/example-vpc
    description: The VPC the peering connection belongs to, in the `PROJECT/VPC_ID` format.
  gcp_project_id:
    description: Google Cloud project ID.
    example: my-gcp-project
  peer_vpc:
    description: Google Cloud VPC network name.
    example: my-vpc
  state_info:
    additionalProperties:
      type: string
  self_link:
    type: string
    computed: true
    description: Computed Google Cloud network peering link.
    example: https://www.googleapis.com/compute/v1/projects/my-gcp-project/global/networks/my-vpc
