# yaml-language-server: $schema=.schema.yml
resource:
  description: Creates and manages a Google Cloud VPC peering connection.
  refreshStateExists: true
  deleteStateGone: true
  removeMissing: true
  modifyPlan: true
datasource:
  description: The GCP VPC Peering Connection data source provides information about the existing Aiven VPC Peering Connection.
  # VpcGet returns all peerings for a VPC and accepts no peer filters.
  # These overrides define Terraform's local lookup, which OpenAPI does not describe.
  schemaOverride:
    # Either `vpc_id` or `project` with `project_vpc_id` selects the Aiven VPC.
    project:
      optional: true
      computed: true
      description: The name of the project the Aiven VPC belongs to.
    project_vpc_id:
      optional: true
      computed: true
      description: The ID of the Aiven VPC.
    vpc_id:
      optional: true
      computed: true
      description: The VPC the peering connection belongs to, in the `PROJECT/PROJECT_VPC_ID` format.
clientHandler: vpc
idAttributeComposed: [project, project_vpc_id, gcp_project_id, peer_vpc]
legacyTimeouts: true
rename:
  peer_cloud_account: gcp_project_id
operations:
  - id: VpcPeeringConnectionCreate
    type: create
    disableView: true
  - id: VpcGet
    type: read
    resultKey: peering_connections
    disableView: true
  - id: VpcPeeringConnectionDelete
    type: delete
    disableView: true
remove:
  - peer_region
  - peer_resource_group
  - peering_connection_id
  - "state_info/*"
  - update_time
  - user_peer_network_cidrs
  - vpc_peering_connection_type
  - peer_azure_app_id # Azure app registration id in UUID4 form that is allowed to create a peering to the peer vnet
  - peer_azure_tenant_id # Azure tenant id in UUID4 form
schema:
  create_time:
    description: |
      VPC peering connection creation timestamp. Re-creating a connection updates this timestamp even when its ID stays the same.
      May be `null` for legacy connections whose creation time is unknown.
  # modifyPlan replaces the resource when the Aiven VPC changes, so switching between
  # `vpc_id` and `project` with `project_vpc_id` keeps the connection.
  project:
    optional: true
    computed: true
    forceNew: false
    alsoRequires: [project_vpc_id]
    description: The name of the project the Aiven VPC belongs to. Changing the Aiven VPC forces recreation of the resource.
    example: example-project
  project_vpc_id:
    optional: true
    computed: true
    forceNew: false
    alsoRequires: [project]
    conflictsWith: [vpc_id]
    description: The ID of the Aiven VPC. Changing the Aiven VPC forces recreation of the resource.
    example: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
  vpc_id:
    type: string
    optional: true
    computed: true
    forceNew: false
    exactlyOneOf: [vpc_id, project]
    pattern: '^[^/]*/[^/]*$'
    description: The VPC the peering connection belongs to, in the `PROJECT/PROJECT_VPC_ID` format. Changing the Aiven VPC forces recreation of the resource; switching to `project` and `project_vpc_id` doesn't.
    deprecationMessage: Use the separate `project` and `project_vpc_id` fields instead.
    example: example-project/1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
  gcp_project_id:
    description: Google Cloud project ID.
    example: my-gcp-project
  peer_vpc:
    description: Google Cloud VPC network name.
    example: my-vpc
  state_info:
    additionalProperties:
      type: string
  self_link:
    type: string
    computed: true
    description: Computed Google Cloud network peering link.
    example: https://www.googleapis.com/compute/v1/projects/my-gcp-project/global/networks/my-vpc
