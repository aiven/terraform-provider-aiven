# yaml-language-server: $schema=.schema.yml
beta: true
resource:
  ignoreAlreadyExists: true
  description: |
    Provisions a BYOC custom cloud environment by handing Aiven the IAM role
    ARN created in the customer AWS account. Transitions the environment from
    `draft` to `active` so services can be deployed into it.

    Create this resource after the customer-side AWS infrastructure
    (IAM role, VPC, subnets, security groups, buckets) has been defined.
  stateAttribute: state
  refreshStateDesired: [active]
  refreshStateFailed: [creation_failed, deleted] # Checked after create/update only; delete polls deleteStateDesired
  deleteStateDesired: [deleted]
clientHandler: byoc
idAttributeComposed: [organization_id, custom_cloud_environment_id]
operations:
  - id: CustomCloudEnvironmentProvision
    type: create
    resultKey: custom_cloud_environment
  - id: CustomCloudEnvironmentGet
    type: read
    resultKey: custom_cloud_environment
  - id: CustomCloudEnvironmentUpdate
    type: update
    resultKey: custom_cloud_environment
  - id: CustomCloudEnvironmentDelete
    type: delete
remove:
  # Environment attributes belong to aiven_byoc_aws_entity, which creates the
  # environment. This resource only hands over the IAM role that activates it.
  - aiven_aws_object_storage_credentials_creator_arn
  - aiven_aws_object_storage_user_arn
  - aiven_management_cidr_blocks
  - aiven_object_storage_credentials_creator_user
  - aws_subnets_bastion
  - aws_subnets_workload
  - bucket_names
  - byoc_resource_tags
  - byoc_unique_name
  - cloud_provider
  - cloud_region
  - contact_emails
  - deployment_model
  - display_name
  - errors
  - reserved_cidr
  - tags
  - update_time
  - use_customer_owned_storage
  - aiven_azure_cce_client_id # Application (client) ID of the Aiven multi-tenant Azure CCE service principal.
  - aiven_google_account_principal # Google account identifier
  - azure_subscription_id # UUID identifying the customer's Azure subscription where BYOC infrastructure is deployed.
  - azure_tenant_id # Entra ID tenant ID of the customer's directory where the Aiven CCE enterprise application is installed.
  - google_bastion_cidr # Private IP address block for the workload VPC containing the bastion subnet
  - google_privilege_bearing_service_account_id # Google account identifier
  - google_workload_cidr # Private IP address block for the workload VPC containing the workload subnet
  - oracle_compartment_id # Used to uniquely identify an asset in Oracle's cloud. May refer to a range of object types including instance, tenancy,...
  - oracle_subnet_bastion # CIDR for the bastion subnet
  - oracle_subnet_workload # CIDR for the private workload subnet
schema:
  organization_id:
    ref: aiven_organization.id
    forceNew: true
  custom_cloud_environment_id:
    ref: aiven_byoc_aws_entity.custom_cloud_environment_id
    forceNew: true
    format: uuid
  aws_iam_role_arn:
    required: true
