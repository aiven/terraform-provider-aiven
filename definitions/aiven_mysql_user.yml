# yaml-language-server: $schema=.schema.yml
include: .service_user.yml
resource:
  description: Creates and manages an Aiven for MySQL® service user.
datasource:
  description: Gets information about an Aiven for MySQL® service user.
requireServiceReady: [mysql]
schema:
  project:
    ref: aiven_mysql.project
  authentication:
    computed: true
  type:
    description: User account type, such as primary or regular account.
  service_name:
    ref: aiven_mysql.service_name
    description: The name of the MySQL® service user.
  username:
    description: The name of the MySQL® service user.
remove:
  - access_control/pg_allow_replication # Enable REPLICATION role option
  - access_control/valkey_acl_categories # Command category rules
  - access_control/valkey_acl_channels # Glob-style patterns defining which pub/sub channels can be accessed. If array is not defined, the default policy is used...
  - access_control/valkey_acl_commands # Rules for individual commands
  - access_control/valkey_acl_databases # Database ids the user can access, Valkey 9.1 and later only. An empty array or 'alldbs' grants all databases, 'resetdbs'...
  - access_control/valkey_acl_keys # Key access rules
