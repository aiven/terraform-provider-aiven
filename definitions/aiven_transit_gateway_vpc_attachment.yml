# yaml-language-server: $schema=.schema.yml
resource:
  description: Creates and manages an AWS Transit Gateway VPC attachment for an Aiven project VPC.
  refreshStateExists: true
  deleteStateGone: true
  removeMissing: true
datasource:
  description: Gets information about an AWS Transit Gateway VPC attachment for an Aiven project VPC.
  # VpcGet returns all peerings for a VPC and accepts no peer filters.
  # These overrides define Terraform's local lookup, which OpenAPI does not describe.
  schemaOverride:
    # Either `vpc_id` or `project` with `project_vpc_id` selects the Aiven VPC.
    project:
      optional: true
      computed: true
      description: The name of the project the Aiven VPC belongs to.
    project_vpc_id:
      optional: true
      computed: true
      description: The ID of the Aiven VPC.
    vpc_id:
      optional: true
      computed: true
      description: Aiven project VPC ID in the `PROJECT/PROJECT_VPC_ID` format.
    peer_cloud_account:
      required: true
    peer_vpc:
      required: true
    # OpenAPI's region default applies to creation; local lookup searches all regions when omitted.
    # Optional + Computed allows either an explicit filter or a region filled from the unique match.
    peer_region:
      computed: true
      description: AWS region of the Transit Gateway. When omitted, the data source searches all regions and requires a single matching attachment.
clientHandler: vpc
# The region is left out: an omitted `peer_region` can't hold the region the API resolves.
idAttributeComposed: [project, project_vpc_id, peer_cloud_account, peer_vpc]
legacyTimeouts: true
operations:
  - id: VpcPeeringConnectionCreate
    type: create
    disableView: true
  - id: VpcGet
    type: read
    resultKey: peering_connections
    disableView: true
  - id: VpcPeeringConnectionUpdate
    type: update
    resultKey: peering_connections
    disableView: true
  - id: VpcPeeringConnectionDelete
    type: delete
    disableView: true
remove:
  - add
  - create_time
  - delete
  - "peer_azure_*"
  - peer_resource_group
  - "state_info/*"
  - update_time
  - vpc_peering_connection_type
schema:
  # modifyPlan replaces the resource when the Aiven VPC changes, so switching between
  # `vpc_id` and `project` with `project_vpc_id` keeps the attachment.
  project:
    optional: true
    computed: true
    forceNew: false
    alsoRequires: [project_vpc_id]
    description: The name of the project the Aiven VPC belongs to. Changing the Aiven VPC forces recreation of the resource.
    example: example-project
  project_vpc_id:
    optional: true
    computed: true
    forceNew: false
    alsoRequires: [project]
    conflictsWith: [vpc_id]
    description: The ID of the Aiven VPC. Changing the Aiven VPC forces recreation of the resource.
    example: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
  vpc_id:
    ref: aiven_project_vpc.id
    type: string
    optional: true
    computed: true
    forceNew: false
    exactlyOneOf: [vpc_id, project]
    pattern: '^[^/]*/[^/]*$'
    example: example-project/1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
    description: Aiven project VPC ID in the `PROJECT/PROJECT_VPC_ID` format. Changing the Aiven VPC forces recreation of the resource; switching to `project` and `project_vpc_id` doesn't.
    deprecationMessage: Use the separate `project` and `project_vpc_id` fields instead.
  peer_cloud_account:
    description: AWS account ID that owns the Transit Gateway.
  peer_region:
    description: AWS region of the Transit Gateway. When omitted, the Aiven project VPC region is used.
  peer_vpc:
    example: tgw-0123456789abcdef0
    description: AWS Transit Gateway ID.
  user_peer_network_cidrs:
    computed: true
    useStateForUnknown: true
    forceNew: false
  state_info:
    additionalProperties:
      type: string
  peering_connection_id:
    example: pcx-0123456789abcdef0
    description: Legacy AWS VPC peering connection ID (`pcx-*`) for ordinary AWS VPC peering connections, if available. This is not the AWS Transit Gateway attachment ID; TGW attachment details are exposed in `state_info`.
