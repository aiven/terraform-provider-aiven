# yaml-language-server: $schema=.schema.yml
resource:
  description: |
    Creates and manages an AWS Transit Gateway VPC attachment for an Aiven project VPC.
    Configure either `vpc_id` or both `project` and `project_vpc_id` to select the Aiven VPC.

    Legacy configurations using an AWS VPC ID (`vpc-*`) as `peer_vpc` create ordinary AWS VPC peerings.
    When `peer_region` is omitted, lookups require a single matching connection across all regions.
    Another connection with the same AWS account and VPC in a different region can prevent refresh or deletion.
    Use `aiven_aws_vpc_peering_connection` for new AWS VPC peerings.
  refDepth: 2
  refreshStateExists: true
  deleteStateGone: true
  removeMissing: true
  importIDFormats:
    - PROJECT/PROJECT_VPC_ID/PEER_CLOUD_ACCOUNT/PEER_VPC
    - PROJECT/PROJECT_VPC_ID/PEER_CLOUD_ACCOUNT/PEER_VPC/PEER_REGION
datasource:
  description: Gets information about an AWS Transit Gateway VPC attachment for an Aiven project VPC.
  # VpcGet returns all peerings for a VPC and accepts no peer filters.
  # These overrides define Terraform's local lookup, which OpenAPI does not describe.
  schemaOverride:
    # OpenAPI has no Terraform ID; the local lookup builds it from the matched connection.
    id:
      computed: true
      description: Resource ID in the `PROJECT/PROJECT_VPC_ID/PEER_CLOUD_ACCOUNT/PEER_VPC` format, with `/PEER_REGION` appended when the matched connection has a region.
    # Either `vpc_id` or `project` with `project_vpc_id` selects the Aiven VPC.
    project:
      optional: true
      computed: true
      description: The name of the project the Aiven VPC belongs to.
    project_vpc_id:
      optional: true
      computed: true
      description: The ID of the Aiven VPC.
    vpc_id:
      optional: true
      computed: true
      description: Aiven project VPC ID in the `PROJECT/PROJECT_VPC_ID` format.
    peer_cloud_account:
      required: true
    peer_vpc:
      required: true
    # OpenAPI's region default applies to creation; local lookup searches all regions when omitted.
    # Optional + Computed allows either an explicit filter or a region filled from the unique match.
    peer_region:
      computed: true
      description: AWS region of the Transit Gateway. When omitted, the data source searches all regions and requires a single matching attachment.
clientHandler: vpc
# The optional region suffix records whether peer_region was explicitly supplied.
# A fixed idAttributeComposed cannot preserve both supported ID formats.
legacyTimeouts: true
operations:
  - id: VpcPeeringConnectionCreate
    type: create
    disableView: true
  - id: VpcGet
    type: read
    resultKey: peering_connections
    disableView: true
  - id: VpcPeeringConnectionUpdate
    type: update
    resultKey: peering_connections
    disableView: true
  - id: VpcPeeringConnectionDelete
    type: delete
    disableView: true
remove:
  - add
  - create_time
  - delete
  - "peer_azure_*"
  - peer_resource_group
  - "state_info/*"
  - update_time
  - vpc_peering_connection_type
schema:
  id:
    type: string
    computed: true
    description: Resource ID in the `PROJECT/PROJECT_VPC_ID/PEER_CLOUD_ACCOUNT/PEER_VPC` format, with `/PEER_REGION` appended when the region is explicitly specified.
    example: example-project/1a2b3c4d-5e6f-4a8b-9c0d-1e2f3a4b5c6d/123456789012/tgw-0123456789abcdef0/us-east-1
  # modifyPlan replaces the resource when the Aiven VPC changes, so switching between
  # `vpc_id` and `project` with `project_vpc_id` keeps the attachment.
  project:
    ref: aiven_project_vpc.project
    optional: true
    computed: true
    forceNew: false
    alsoRequires: [project_vpc_id]
    description: The name of the project the Aiven VPC belongs to. Changing the Aiven VPC forces recreation of the resource.
    example: example-project
  project_vpc_id:
    ref: aiven_project_vpc.project_vpc_id
    format: uuid
    # OpenAPI omits the lowercase UUID restriction on project VPC paths.
    pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    optional: true
    computed: true
    forceNew: false
    alsoRequires: [project]
    conflictsWith: [vpc_id]
    description: The ID of the Aiven VPC. Changing the Aiven VPC forces recreation of the resource.
  vpc_id:
    ref: aiven_project_vpc.id
    type: string
    optional: true
    computed: true
    forceNew: false
    exactlyOneOf: [vpc_id, project]
    # This Terraform selector is absent from OpenAPI; its VPC component must be a lowercase UUID.
    pattern: '^[^/]*/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    example: example-project/1a2b3c4d-5e6f-4a8b-9c0d-1e2f3a4b5c6d
    description: Aiven project VPC ID in the `PROJECT/PROJECT_VPC_ID` format. Changing the Aiven VPC forces recreation of the resource; switching to `project` and `project_vpc_id` doesn't.
  peer_cloud_account:
    description: AWS account ID that owns the Transit Gateway.
  peer_region:
    description: AWS region of the Transit Gateway. When omitted, the Aiven project VPC region is used.
  peer_vpc:
    example: tgw-0123456789abcdef0
    description: AWS Transit Gateway ID.
  user_peer_network_cidrs:
    # Omitted CIDRs are read from the API and can change outside Terraform.
    computed: true
    forceNew: false
  state_info:
    additionalProperties:
      type: string
  peering_connection_id:
    # This legacy Terraform output comes from state_info, not a top-level Project VPC API field.
    type: string
    computed: true
    # The generator treats *_id fields as stable, but the API omits this ID after rejection.
    useStateForUnknown: false
    example: pcx-0123456789abcdef0
    description: Legacy AWS VPC peering connection ID (`pcx-*`) for ordinary AWS VPC peering connections, if available. This is not the AWS Transit Gateway attachment ID; TGW attachment details are exposed in `state_info`.
