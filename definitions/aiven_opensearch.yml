# yaml-language-server: $schema=.schema.yml
include: .service.yml
resource:
  description: Creates and manages an [Aiven for OpenSearch®](https://aiven.io/docs/products/opensearch) service.
datasource:
  description: Gets information about an Aiven for OpenSearch® service.
version: 1
operations:
  - id: ServiceCreate
    type: create
    resultKey: service
    fixedValues:
      service_type: opensearch
  - id: ServiceGet
    type: read
    resultKey: service
    queryParams:
      include_secrets: "true"
  - id: ServiceUpdate
    type: update
    resultKey: service
  - id: ServiceDelete
    type: delete
schema:
  service_name:
    example: my-opensearch
  opensearch_user_config:
    minimalExample: true
  opensearch:
    type: object
    computed: true
    sensitive: true
    useStateForUnknown: true
    description: Values provided by the OpenSearch server.
    properties:
      uris:
        type: arrayOrdered
        items:
          type: string
        description: OpenSearch server URIs.
      opensearch_dashboards_uri:
        type: string
        description: URI for OpenSearch dashboard frontend.
      kibana_uri:
        type: string
        description: URI for Kibana dashboard frontend.
        deprecationMessage: This field was added by mistake and has never worked. It will be removed in future versions.
      username:
        type: string
        description: OpenSearch username.
      password:
        type: string
        description: OpenSearch password.
