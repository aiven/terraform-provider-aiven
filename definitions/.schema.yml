# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema

type: object
$comment: |
  This schema defines the structure for configuring Terraform provider resources and datasources.
  Use this file to specify how your provider's resources and datasources should behave.
properties:
  include:
    type: string
    $comment: |
      A shared definition file to build on, e.g. ".service_user.yml".
      Its maps are merged and its lists appended, the other values of this file win, e.g. a "remove" list adds to the included one.
      An included list can't be replaced, e.g. an enum: keep it out of the shared file.
  version:
    type: integer
    $comment: |
      Specifies the version/generation of the resource schema.
      A migrated resource keeps its SDK "SchemaVersion", or its state can't be read,
      e.g., 1 for "aiven_service_integration".
      There are no state upgraders: users upgrade an older state with an older provider version,
      listed in the table of "templates/guides/upgrade-guide-v3-to-v4.md".
  beta:
    type: boolean
    $comment: |
      Indicates whether this resource or datasource is in beta status.
      If not specified, the beta status may be inferred from OperationID schemas.
  limitedAvailability:
    type: boolean
    $comment: |
      Indicates whether this resource or datasource is in limited availability.
      Limited availability resources render limited availability documentation.
  legacyTimeouts:
    type: boolean
    $comment: |
      Set to true to use legacy timeout handling for this resource.
      This is only needed for SDKv2 compatibility.
  resource:
    type: object
    properties:
      description:
        type: string
        description: Description/documentation for this resource type.
      deprecationMessage:
        type: string
        description: Deprecation message for this resource, if applicable.
      terminationProtection:
        type: boolean
        description: |
          Set to true to enable termination protection validation for this resource.
          The `termination_protection` attribute generated automatically.
      stateAttribute:
        type: string
        minLength: 1
        $comment: |
          Terraform attribute polled by refreshStateDesired and deleteStateDesired.
          Required when either list is set. Must be computed-only when used with refreshStateDesired.
      refreshStateExists:
        type: boolean
        const: true
        $comment: |
          Enables a post-Create/Update Read that completes on the first successful Read,
          retrying transient 404/403 errors. Omit this when refreshStateDesired is set: desired
          already retries those errors until the resource exists, then waits for the attribute value.
      refreshStateDesired:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
        $comment: |
          Enables a post-Create/Update Read that waits until `stateAttribute` matches any of
          these values. Transient 404/403 errors are retried until the resource exists
          (refreshStateExists is implied). Values in neither this list nor refreshStateFailed
          are treated as pending and retried until the operation timeout.
      refreshStateFailed:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
        $comment: |
          Terminal failure values for `stateAttribute`. A match against any value fails refresh
          immediately. Requires refreshStateDesired.
      refreshStateDelay:
        type: string
        example: 10s
        $comment: |
          The duration to sleep after the resource is created/updated, before the first refresh Read.
          This is useful to avoid race conditions with the backend.
          For instance, when a new user is created, the backend might hit a read-replica.
          So we sleep for a few seconds to give the backend time to catch up.
          Requires refreshStateExists or refreshStateDesired.
      deleteStateGone:
        type: boolean
        const: true
        $comment: |
          Enables the delete poller and completes when Read returns 404. Delete is re-issued while
          it errors (for example 409 from dependents still detaching); once Delete succeeds, only
          Read is polled. Omit this when deleteStateDesired is set: a 404 already completes desired.
      deleteStateDesired:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
        $comment: |
          Enables the delete poller and completes when `stateAttribute` matches any value here, or
          when Read returns 404 (deleteStateGone is implied). Delete is re-issued while it errors
          (for example 409); once Delete succeeds, only Read is polled. Values are validated against
          the field's enum when one is declared. Omit both to delete without polling.
      removeMissing:
        type: boolean
        $comment: |
          Set to true to remove the resource from the state if it's missing (i.e., if Read() returns an avngen.IsNotFound error).
          Useful for resources that Aiven may automatically delete, such as users or databases when a service has been turned off and then on again.
      ignoreAlreadyExists:
        type: boolean
        $comment: |
          Set to true to treat a 409 Conflict ("already exists") response from Create as success.
          Useful for one-shot provisioning actions that should adopt an existing entity rather than fail on re-run.
          Requires `refreshStateExists` or `refreshStateDesired` so the state is populated by the subsequent Read.
          Does NOT work for resources whose ID is returned only in the Create response (e.g. server-assigned IDs):
          on conflict there is no response to read the ID from and the subsequent Read has nothing to look up.
      disableExample:
        type: boolean
        $comment: |
          Set to true to disable Terraform example file generation for this resource.
      refDepth:
        type: integer
        minimum: 1
        $comment: |
          Limits the doc example to this many resource blocks along each `ref` chain, this resource included.
          The last block renders its refs as literals. Unlimited when omitted.
      importIDFormats:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          minLength: 1
        $comment: |
          Import identifier formats to show in the generated resource documentation and import.sh.
          This is documentation metadata only and does not change runtime ID parsing.
      validateConfig:
        type: boolean
        $comment: |
          Set to true to wire `validateConfig` as the resource's ResourceWithValidateConfig
          handler. The package must declare a function named `validateConfig` with the
          adapter.ResourceOptions.ValidateConfig signature. Use this for config-only,
          cross-field validation that does not need prior state.
          https://developer.hashicorp.com/terraform/plugin/framework/resources/validate-configuration#validateconfig-method
      modifyPlan:
        type: boolean
        $comment: |
          Set to true to wire `modifyPlan` as the resource's ResourceWithModifyPlan handler.
          The package must declare a function named `modifyPlan` with the
          adapter.ResourceOptions.ModifyPlan signature. Use this for plan-time checks that
          need access to prior state (e.g. forbidding a decrease in a numeric attribute).
          `modifyPlan` may also write plan values, and `d.RequiresReplace(name)` marks the
          attributes whose computed value forces a replacement.
          https://developer.hashicorp.com/terraform/plugin/framework/resources/plan-modification#resource-plan-modification
    dependentRequired:
      refreshStateFailed:
        - refreshStateDesired
        - stateAttribute
      refreshStateDesired:
        - stateAttribute
      deleteStateDesired:
        - stateAttribute
    dependentSchemas:
      refreshStateDelay:
        anyOf:
          - required: [refreshStateExists]
          - required: [refreshStateDesired]
      ignoreAlreadyExists:
        anyOf:
          - required: [refreshStateExists]
          - required: [refreshStateDesired]
      stateAttribute:
        anyOf:
          - required: [refreshStateDesired]
          - required: [deleteStateDesired]
      refreshStateExists:
        not:
          anyOf:
            - required: [refreshStateDesired]
            - required: [refreshStateFailed]
      deleteStateGone:
        not:
          required: [deleteStateDesired]
    $comment: |
      Documentation and configuration specific to this resource type.
      Use this to provide clear descriptions for your resource in the Terraform registry.
  datasource:
    type: object
    properties:
      description:
        type: string
        description: Description/documentation for this datasource.
      deprecationMessage:
        type: string
        description: Deprecation message for this datasource, if applicable.
      disableExample:
        type: boolean
        $comment: |
          Set to true to disable Terraform example file generation for this datasource.
      schemaOverride:
        type: object
        additionalProperties:
          $ref: "#/definitions/Schema"
        $comment: |
          Datasource-only schema overlay. Has the same shape as the top-level
          `schema` field, but is merged on top of the base schema only when the
          datasource is generated. Use this to add datasource-only attributes
          (e.g. composed-id aliases) or to override base schema entries solely
          for the datasource. Resource schema generation ignores this block.
      exactlyOneOf:
        type: array
        items:
          type: string
        minItems: 2
        $comment: |
          Top-level "exactly one of" discriminator group. Emits
          `datasourcevalidator.ExactlyOneOf(...)` in datasourceConfigValidators
          and drives the example LOOKUP hint. Supersedes the legacy
          lookup-contract validator when set.
    $comment: |
      Documentation and configuration specific to this datasource.
      Use this to provide clear descriptions for your datasource in the Terraform registry.
  remove:
    $ref: '#/definitions/Remove'
    $comment: |
      List of attributes to remove from the resource/datasource. Entries are matched against the
      attribute's OpenAPI path, where nested attributes are slash-separated, e.g. "plans/node_count".
      Example: remove: ["openapi_name1", "nested/openapi_name2"]

      Entries are glob patterns:
        "*"  matches any run of characters within a single path segment, e.g. "azure_*" drops
             every top-level attribute with that prefix, and "*google*" drops every top-level
             attribute containing "google".
        "?"  matches exactly one character within a single path segment.
        "**" matches across segments, e.g. "**/errors" drops "errors" at any depth.
      A pattern without wildcards is an exact match, so plain attribute names keep working.

      Prefer globs over long explicit lists when the removed attributes share an obvious prefix,
      such as a cloud provider name that the resource does not support.
  idAttributeComposed:
    type: array
    minItems: 1
    items:
      type: string
      $comment: A list of fields to compose the ID attribute from
  operations:
    type: array
    $comment: |
      A list of CRUD operations supported by this resource.
      Each entry specifies an operation, with its OpenAPI ID, type, and result extraction instructions.
    items:
      $ref: '#/definitions/Operation'
  rename:
    $ref: '#/definitions/Rename'
    $comment: |
      List of attributes to rename in the resource/datasource.
      Example: rename: {"old_openapi_name": "new_terraform_name"}
  schema:
    $ref: '#/definitions/Schema'
    $comment: |
      Configuration for the resource/datasource schema.
      Use this to override the schema from the OpenAPI spec or add new fields.

  clientHandler:
    type: string
    $comment: |
      The name of the client package to use for this resource/datasource.
      Example: clientHandler: "organization"
  planModifier:
    type: boolean
    $comment: |
      Set to true to use the plan modifier for this resource/datasource. 
      Plan modifier is called before expandModifier and has access to the plan client
  expandModifier:
    type: boolean
  flattenModifier:
    type: boolean
  requireServiceReady:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      enum:
        - pg
        - cassandra
        - opensearch
        - grafana
        - mysql
        - kafka
        - kafka_connect
        - kafka_mirrormaker
        - flink
        - clickhouse
        - thanos
        - valkey
    $comment: |
      Accepted service types. Fails Create/Read/Update when the target service is
      powered off or its `service_type` is not in the list. Requires top-level
      `project` and `service_name` string attributes. Delete is not gated.
  userConfigDiscriminator:
    type: string
    $comment: |
      The attribute whose value selects the user config schema, e.g. "endpoint_type".
      Splits the root field with a "oneOf" schema into a "<value>_user_config" block per schema.
      Only the block of the attribute's value is sent, the resource config validation rejects the others.
      Can't be combined with "validateConfig": call adapter.ValidateUserConfig from it instead.
      A create operation's "fixedValues" for the attribute limits the blocks to its value, e.g. "service_type: pg".
required:
  - operations
additionalProperties: false

definitions:
  Remove:
    type: array
    items:
      type: string
      $comment: The attribute to remove, either an exact path or a glob pattern

  Operation:
    type: object
    $comment: |
      Aiven OperationID and CRUD operation pairs.
    properties:
      id:
        type: string
        $comment: The operation's unique identifier, e.g. "OrganizationCreate"
      type:
        type: string
        enum: ["create", "read", "update", "delete"]
        $comment: The type of operation (create, read, etc.)
      disableView:
        type: boolean
        $comment: Set to true to disable view generation for this specific operation
      datasourceLookup:
        type: boolean
        $comment: |
          Set to true to inline this read op as the data source's lookup branch (not
          wired into the resource view). The values of `resultListLookupKeys` become the
          composedOf lookup attributes, driving the data source's validators, schema
          flags, example hint and the id-empty branch inlined into the data source's
          readView.
        dependencies:
          - resultListLookupKeys
      resultIDField:
        type: string
        $comment: |
          Go field name on the lookup result item that holds the primary id. When set on
          a datasourceLookup op the lookup is used only to resolve the primary id: the
          generator emits `d.Set(id, match.<resultIDField>)` and lets control fall through
          to the canonical read body in the same readView. Use this when the lookup
          endpoint returns a different shape than the canonical read endpoint.
        dependencies:
          - datasourceLookup
          - resultListLookupKeys
      resultKey:
        type: string
        $comment: |
          The key to extract the result object from the response (if the API nests result under a property)
          E.g.: resultKey: "result" retrieves response.result
      resultKeyField:
        type: string
        $comment: |
          Go field name on the client response struct to drill into before further processing.
          Use when the API nests the actual resource (or the list of candidates) under an
          extra wrapper that the Go client does not strip.
          Examples:
            - resultKeyField: "Aws" with no resultListLookupKeys -> d.Flatten(rsp.Aws)
              (single nested object, e.g. {accessors: {aws: {...}}}).
            - resultKeyField: "ConnectionPools" with resultListLookupKeys -> the list
              `rsp.ConnectionPools` is searched by the lookup keys to find the item.
      resultListLookupKeys:
        type: object
        additionalProperties:
          type: string
        $comment: |
          Used to find the correct item in a list response.
          Maps client response field names (key) to Terraform schema attributes (value).
      resultToKey:
        type: string
        $comment: |
          When the API response is not an object (e.g., a primitive or array), wrap it into a map using this key.
      fixedValues:
        type: object
        additionalProperties:
          type: string
        $comment: |
          Request fields always sent with these values (create only), e.g. the discriminator
          of a polymorphic endpoint: `cloud_provider: azure`. List the fields in `remove`,
          or keep them to read them back: they are computed-only.
      queryParams:
        type: object
        additionalProperties:
          type: string
        $comment: |
          Query parameters sent with every call, e.g. `include_secrets: "true"`.
          The keys must be query parameters of the operation.
    required:
      - id
      - type
    additionalProperties: false

  Rename:
    type: object
    $comment: Configuration for renaming OpenAPI schema attributes
    properties:
      rename:
        type: string
        $comment: New name for the attribute

  Schema:
    type: object
    $comment: Configuration for modifying resource attributes
    properties:
      jsonName:
        type: string
        $comment: The name of the attribute in the JSON schema
      computed:
        type: boolean
        $comment: |
          Set to true if this attribute's value is determined by the provider/API.
      useStateForUnknown:
        type: boolean
        $comment: |
          During the planning phase Terraform shows "known after apply" for computed attributes.
          Set this to true if the attribute's value should be taken from the current state during planning.
          Computed-only "*_id", "uuid", "created_at", "created_by" and "create_time" root attributes get
          this automatically. Set it to false to opt them out.
      default:
        type: any
        $comment: Default value for this attribute
      dropDefault:
        type: boolean
        $comment: |
          Drops the OpenAPI default from the generated schema.
          A migration workaround: the SDKv2 resource had no default and stored the Terraform
          zero value for an omitted optional field, so a generated default would plan a change
          against existing state. The resource sends the API default from its create view instead.
          todo: drop in v5.0.0, when the state written by SDKv2 is no longer supported.
      deprecationMessage:
        type: string
        $comment: |
          Message indicating this attribute will be removed in a future version.
          Example: "Use 'new_attribute' instead"
      description:
        type: string
        $comment: |
          Updated description for the attribute.
          Example: "The size of the instance in GB"
      example:
        type: any
        $comment: |
          Example value rendered into the generated example .tf files (and surfaced
          in the docs). The literal type should match the attribute's `type` (string
          for strings, integer for ints, etc.). Examples are also auto-loaded from
          the OpenAPI spec; set this only when the spec lacks one or you need to
          override it.
      disableExample:
        type: boolean
        $comment: Keeps the field out of the generated example files, e.g., a block the service type rejects.
      minimalExample:
        type: boolean
        $comment: Renders only the required fields of the block in the generated example files, or nothing without them, e.g., "pg_user_config".
      ref:
        type: string
        pattern: ^aiven_[a-z0-9_]+\.[a-z0-9_]+$
        $comment: |
          The resource attribute this field usually references, as "<resource type>.<attribute>",
          e.g. `aiven_kafka.service_name`. Documentation only: the resource doc example renders
          the referenced resource and references its attribute instead of a literal value.
          The referenced block comes from the target definition's generated example,
          or from `examples/resources/<resource type>/resource.tf` for hand-written examples, required fields only.
          Scalar fields only. When several resources fit, reference the newest non-deprecated one:
          organization resources are the newest, e.g. `aiven_organization_project.project_id`, not `aiven_project.project`.
      items:
        $ref: "#/definitions/Schema"
        $comment: Array item or Map item configuration
      additionalProperties:
        $ref: "#/definitions/Schema"
        $comment: Additional properties for object types
      enum:
        type: array
        items:
          type: any
        $comment: List of allowed values for this attribute, replaces the OpenAPI enum
      forceNew:
        type: boolean
        $comment: Set to true if changes to this attribute destroy the resource
      maximum:
        type: integer
        $comment: Maximum allowed value for numeric attributes
      maxItems:
        type: integer
        $comment: Maximum number of items allowed in an array/list
      maxLength:
        type: integer
        $comment: Maximum length allowed for string attributes
      minimum:
        type: integer
        $comment: Minimum allowed value for numeric attributes
      minItems:
        type: integer
        $comment: Minimum number of items required in an array/list
      minLength:
        type: integer
        $comment: Minimum length required for string attributes
      pattern:
        type: string
        $comment: |
          Regular expression that string values must match.
          Compiled with Go's `regexp` package (RE2 syntax) and enforced via `stringvalidator.RegexMatches`.
          Patterns that use extended Perl features (e.g. lookarounds, backreferences) are not supported by RE2
          and are silently ignored by the generator; no validator is emitted for them.
      format:
        type: string
        enum:
          - cidr
          - ipv4-cidr
          - uuid
        $comment: |
          Known semantic format for string attributes, enforced via a reusable Plugin Framework validator:
          `cidr` (`validators.CIDR`), `ipv4-cidr` (`validators.IPv4CIDR`) or `uuid` (`validators.UUID`, canonical
          8-4-4-4-12 hex form).
          Guessed when unset: `uuid` for fields named `uuid`, `cidr` for fields named `*cidr*`,
          `ipv4-cidr` when such a field also has `maxLength: 18`.
      nullable:
        type: boolean
        $comment: Set to true if this attribute can be null. It can't be both nullable and optional.
      optional:
        type: boolean
        $comment: Set to true if this attribute is optional
      writeOnly:
        type: boolean
        $comment: |
          Set to true if this attribute is write-only. See https://developer.hashicorp.com/terraform/plugin/sdkv2/resources/write-only-arguments
      properties:
        type: object
        additionalProperties:
          $ref: "#/definitions/Schema"
        $comment: Nested attributes for object types
      required:
        type: boolean
        $comment: Set to true if this attribute must be specified by the user
      sensitive:
        type: boolean
        $comment: |
          Set to true if this attribute contains sensitive data (passwords, tokens).
          Sensitive attributes are masked in console output.
      type:
        type: string
        $comment: The data type of this attribute
        enum:
          - string
          - integer
          - number
          - boolean
          - array
          - arrayOrdered
          - object
      conflictsWith:
        type: array
        items:
          type: string
        $comment: List of other attributes that cannot be set if this attribute is set
      exactlyOneOf:
        type: array
        items:
          type: string
        $comment: |
          List of attributes of which exactly one must be set. Emits the
          per-attribute `stringvalidator.ExactlyOneOf`. For the datasource-level
          group see `datasource.exactlyOneOf`.
      atLeastOneOf:
        type: array
        items:
          type: string
        $comment: List of attributes of which at least one must be set
      alsoRequires:
        type: array
        items:
          type: string
        $comment: List of other attributes that must also be set if this attribute is set
    additionalProperties: false
