# The schema the service users share, except aiven_clickhouse_user, which has its own API.
# A definition includes it and adds its descriptions, refs, removals and the fields of its service.
# The lists add up, e.g. the removals and operations of a definition go after these.
clientHandler: service
idAttributeComposed: [project, service_name, username]
legacyTimeouts: true
flattenModifier: true
resource:
  refreshStateExists: true
  removeMissing: true
operations:
  - id: ServiceUserCreate
    type: create
    resultKey: user
    disableView: true
  - id: ServiceUserDelete
    type: delete
  - id: ServiceUserGet
    type: read
    resultKey: user
rename:
  service_username: username
remove:
  - access_cert_not_valid_after_time
  - access_control
  - expiring_cert_not_valid_after_time
  - password_updated_time
schema:
  password:
    type: string
    optional: true
    sensitive: true
    minLength: 8
    maxLength: 256
    conflictsWith: [password_wo]
    description: The password of the service user (auto-generated if not provided).
  password_wo:
    type: string
    optional: true
    writeOnly: true
    sensitive: true
    description: The password of the service user (write-only, not stored in state).
    minLength: 8
    maxLength: 256
    conflictsWith: [password]
    alsoRequires: [password_wo_version]
  password_wo_version:
    type: integer
    optional: true
    description: Version number for `password_wo`. Increment this to rotate the password.
    alsoRequires: [password_wo]
    minimum: 1
