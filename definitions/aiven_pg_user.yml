# yaml-language-server: $schema=.schema.yml
include: .service_user.yml
resource:
  description: Creates and manages an Aiven for PostgreSQL® service user. The built-in admin user belongs to the service itself. Write-only password management is not supported.
datasource:
  description: Gets information about an Aiven for PostgreSQL® service user.
requireServiceReady: pg
expandModifier: true
remove:
  - authentication
  - mysql_grants # MySQL grants for the service user
schema:
  project:
    ref: aiven_pg.project
  type:
    description: The service user account type, either primary or regular.
  service_name:
    ref: aiven_pg.service_name
    description: The name of the service.
  username:
    description: The name of the service user for this service.
  # Hoisted out of access_control (which the resource removes) and reshaped at the root. The
  # spec has no entry at this level, so the schema shape has to be spelled out in full here.
  pg_allow_replication:
    type: boolean
    optional: true
    computed: true
    useStateForUnknown: true
    description: Allows replication. For the default avnadmin user this attribute is required and is always `true`.
