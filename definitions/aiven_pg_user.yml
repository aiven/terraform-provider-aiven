# yaml-language-server: $schema=.schema.yml
resource:
  refreshStateExists: true
  removeMissing: true
  description: Creates and manages an Aiven for PostgreSQL® service user. The built-in admin user belongs to the service itself. Write-only password management is not supported.
datasource:
  description: Gets information about an Aiven for PostgreSQL® service user.
clientHandler: service
idAttributeComposed: [project, service_name, username]
legacyTimeouts: true
requireServicePoweredOn: true
flattenModifier: true
expandModifier: true
operations:
  - id: ServiceUserCreate
    type: create
    resultKey: user
    disableView: true
  - id: ServiceUserDelete
    type: delete
  - id: ServiceUserGet
    type: read
    resultKey: user
rename:
  service_username: username
remove:
  - access_cert_not_valid_after_time
  - access_control
  - authentication
  - expiring_cert_not_valid_after_time
  - password_updated_time
  - mysql_grants # MySQL grants for the service user
schema:
  project:
    ref: aiven_pg.project
  type:
    description: The service user account type, either primary or regular.
  service_name:
    ref: aiven_pg.service_name
    description: The name of the service.
  username:
    description: The name of the service user for this service.
  # Hoisted out of access_control (which the resource removes) and reshaped at the root. The
  # spec has no entry at this level, so the schema shape has to be spelled out in full here.
  pg_allow_replication:
    type: boolean
    optional: true
    computed: true
    useStateForUnknown: true
    description: Allows replication. For the default avnadmin user this attribute is required and is always `true`.
  password:
    type: string
    optional: true
    sensitive: true
    minLength: 8
    maxLength: 256
    conflictsWith: [password_wo]
    description: The password of the service user (auto-generated if not provided).
  password_wo:
    type: string
    optional: true
    writeOnly: true
    sensitive: true
    description: The password of the service user (write-only, not stored in state).
    minLength: 8
    maxLength: 256
    conflictsWith: [password]
    alsoRequires: [password_wo_version]
  password_wo_version:
    type: integer
    optional: true
    description: Version number for `password_wo`. Increment this to rotate the password.
    alsoRequires: [password_wo]
    minimum: 1
