# yaml-language-server: $schema=.schema.yml
location: internal/plugin/service/kafkaconnect/custompluginfile
beta: true
limitedAvailability: true
resource:
  removeMissing: true
  modifyPlan: true
  stateAttribute: file_status
  refreshStateDesired: [READY]
  refreshStateFailed: [FAILED]
  description: |
    Creates and manages an Aiven Kafka Connect custom plugin file at the organization level. The
    file is uploaded to the pre-signed URL the API returns, and the provider polls until the
    upload is verified.
clientHandler: kafkaconnectcustomplugin
idAttributeComposed: [organization_id, plugin_file_id]
legacyTimeouts: true
operations:
  - id: KafkaConnectCustomPluginFileCreate
    type: create
    disableView: true
  - id: KafkaConnectCustomPluginFileGet
    type: read
  - id: KafkaConnectCustomPluginFileUpdate
    type: update
  - id: KafkaConnectCustomPluginFileDelete
    type: delete
remove:
  - upload_info
  # Belongs to the plugin, a separate entity shared by all its files, which the API only lets
  # you set for a new plugin name. It isn't managed here.
  - plugin_description
schema:
  organization_id:
    forceNew: true
    description: The ID of the organization the plugin belongs to.
  plugin_name:
    forceNew: true
  plugin_version:
    forceNew: true
  service_type:
    optional: true
    computed: true
    default: kafka_connect
    forceNew: true
    useStateForUnknown: true
  content_type:
    optional: true
    computed: true
    default: application/java-archive
    forceNew: true
    useStateForUnknown: true
  # Neither field exists in the API: the file is uploaded out of band, on a pre-signed URL.
  source:
    type: string
    required: true
    # A path change alone re-uploads nothing; source_checksum (via modifyPlan) drives replacement.
    forceNew: false
    description: Local path to the JAR or ZIP file to upload.
    example: ./my-custom-connectors-2.7.14.jar
  source_checksum:
    type: string
    computed: true
    description: SHA-256 checksum of the local file. Computed automatically; forces replacement when the file content changes.
