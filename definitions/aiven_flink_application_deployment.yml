# yaml-language-server: $schema=.schema.yml
resource:
  refreshState: true
  removeMissing: true
  disableExample: true
  description: Creates and manages the deployment of an Aiven for Apache Flink® application.
identityFields: [project, service_name, application_id, deployment_id]
legacyTimeouts: true
requireServiceReady: [flink]
readModifier: true
rename:
  id: deployment_id
remove:
  - error_msg
  - job_id
  - last_savepoint
  - status
operations:
  - id: ServiceFlinkCreateApplicationDeployment
    type: create
  - id: ServiceFlinkGetApplicationDeployment
    type: read
schema:
  parallelism:
    default: 1
    forceNew: true
  restart_enabled:
    default: true
    forceNew: true
  starting_savepoint:
    forceNew: true
  version_id:
    forceNew: true
    format: uuid
  application_id:
    forceNew: true
    format: uuid
