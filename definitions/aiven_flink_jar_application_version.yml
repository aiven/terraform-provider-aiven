# yaml-language-server: $schema=.schema.yml
location: internal/plugin/service/flink/jarversion
beta: true
limitedAvailability: true
resource:
  # Create returns the version before the jar file is uploaded, so the read waits for the upload.
  refreshStateExists: true
  removeMissing: true
  modifyPlan: true
  description: |
    Creates and manages a version of an
    [Aiven for Apache Flink® jar application](https://aiven.io/docs/products/flink/howto/create-jar-application).
    The jar file is uploaded to the pre-signed URL the API returns, and editing the file creates a
    new version. Requires the `aiven_flink` service to have `flink_user_config.custom_code` enabled,
    which allows uploading and deploying custom JARs.
clientHandler: flinkjarapplicationversion
idAttributeComposed: [project, service_name, application_id, application_version_id]
legacyTimeouts: true
requireServicePoweredOn: true
rename:
  id: application_version_id
operations:
  # The generated view creates the version, the custom one uploads the jar file afterwards.
  - id: ServiceFlinkCreateJarApplicationVersion
    type: create
  - id: ServiceFlinkGetJarApplicationVersion
    type: read
  - id: ServiceFlinkDeleteJarApplicationVersion
    type: delete
schema:
  # Virtual: the jar file is uploaded out of band to a pre-signed URL.
  source:
    type: string
    required: true
    # A path change alone uploads nothing. The hash under file_sha256 drives replacement.
    forceNew: false
    description: The path to the jar file to upload.
    example: ./example.jar
  # Flat mirror of file_info.0.file_sha256 so the shared file-upload modify plan can read and
  # write it without walking the nested block.
  file_sha256:
    type: string
    computed: true
    description: The sha256 checksum of the uploaded jar file.
