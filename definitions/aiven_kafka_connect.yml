# yaml-language-server: $schema=.schema.yml
include: .service.yml
resource:
  description: Creates and manages an [Aiven for Apache Kafka® Connect](https://aiven.io/docs/products/kafka/kafka-connect) service.
datasource:
  description: Gets information about an Aiven for Apache Kafka® Connect service.
version: 1
operations:
  - id: ServiceCreate
    type: create
    resultKey: service
    fixedValues:
      service_type: kafka_connect
  - id: ServiceGet
    type: read
    resultKey: service
    queryParams:
      include_secrets: "true"
  - id: ServiceUpdate
    type: update
    resultKey: service
  - id: ServiceDelete
    type: delete
schema:
  service_name:
    example: my-kafka-connect
  kafka_connect_user_config:
    minimalExample: true
