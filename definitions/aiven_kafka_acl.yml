# yaml-language-server: $schema=.schema.yml
location: internal/plugin/service/kafka/acl
resource:
  refreshState: true
  removeMissing: true
  description: |
    Creates and manages Aiven [access control lists](https://aiven.io/docs/products/kafka/concepts/acl) (ACLs) for an Aiven for Apache Kafka® service. ACLs control access to Kafka topics, consumer groups, clusters, and Schema Registry.

    Aiven ACLs provide simplified topic-level control with basic permissions and wildcard support. For more advanced access control, you can use [Kafka-native ACLs](https://registry.terraform.io/providers/aiven/aiven/latest/docs/resources/kafka_native_acl).
datasource:
  description: Gets information about an ACL entry for an Aiven for Apache Kafka® service.
clientHandler: kafka
idAttributeComposed: [project, service_name, acl_id]
legacyTimeouts: true
rename:
  id: acl_id
  kafka_acl_id: acl_id
operations:
  - id: ServiceKafkaAclAdd
    type: create
    resultKey: acl
    resultListLookupKeys:
      Permission: permission
      Topic: topic
      Username: username
  - id: ServiceKafkaAclList
    type: read
    resultKey: acl
    resultListLookupKeys:
      Id: acl_id
  - id: ServiceKafkaAclList
    type: read
    datasourceLookup: true
    resultKey: acl
    resultListLookupKeys:
      Permission: permission
      Topic: topic
      Username: username
  - id: ServiceKafkaAclDelete
    type: delete
    resultKey: acl
schema:
  username:
    pattern: ^[-._*?A-Za-z0-9]+$
