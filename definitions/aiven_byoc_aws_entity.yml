# yaml-language-server: $schema=.schema.yml
beta: true
location: internal/plugin/service/byoc/aws_entity
resource:
  description: |
    Creates and manages a BYOC custom cloud environment on AWS.
clientHandler: byoc
idAttributeComposed: [organization_id, custom_cloud_environment_id]
operations:
  - id: CustomCloudEnvironmentCreate
    type: create
    resultKey: custom_cloud_environment
  - id: CustomCloudEnvironmentGet
    type: read
    resultKey: custom_cloud_environment
  - id: CustomCloudEnvironmentUpdate
    type: update
    resultKey: custom_cloud_environment
  - id: CustomCloudEnvironmentDelete
    type: delete
remove:
  # The API serves every cloud provider from one schema. This resource is AWS
  # only, so anything named after another provider is dropped, including fields
  # the API may add later.
  - "*azure*"
  - "*gcp*"
  - "*google*"
  - "*oracle*"
  - custom_cloud_names
  - errors
  - state
  - update_time
  - aws_iam_role_arn
schema:
  cloud_provider:
    forceNew: true
  cloud_region:
    forceNew: true
  deployment_model:
    forceNew: true
  reserved_cidr:
    forceNew: true
