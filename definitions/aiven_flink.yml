# yaml-language-server: $schema=.schema.yml
include: .service.yml
resource:
  description: Creates and manages an [Aiven for Apache Flink® service](https://aiven.io/docs/products/flink/concepts/flink-features).
datasource:
  description: Gets information about an Aiven for Apache Flink® service.
version: 1
operations:
  - id: ServiceCreate
    type: create
    resultKey: service
    fixedValues:
      service_type: flink
  - id: ServiceGet
    type: read
    resultKey: service
    queryParams:
      include_secrets: "true"
  - id: ServiceUpdate
    type: update
    resultKey: service
  - id: ServiceDelete
    type: delete
schema:
  service_name:
    example: my-flink
  flink_user_config:
    minimalExample: true
  flink:
    type: object
    computed: true
    sensitive: true
    useStateForUnknown: true
    description: Values provided by the Flink server.
    properties:
      host_ports:
        type: arrayOrdered
        items:
          type: string
        description: The host and port of a Flink server.
