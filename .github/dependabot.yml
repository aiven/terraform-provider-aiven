version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      main:
        applies-to: version-updates
        patterns:
          - "*"
      sec:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Updated by `task update-schemas`
      - dependency-name: github.com/aiven/go-client-codegen
    groups:
      main:
        applies-to: version-updates
        patterns:
          - "*"
      sec:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly
    groups:
      main:
        applies-to: version-updates
        patterns:
          - "*"
      sec:
        applies-to: security-updates
        patterns:
          - "*"
